name: Custom Build Release

on:
  push:
    branches:
      - 'release/custom-build'   # Exact match
      # - 'release/**'            # Wildcard match (matches release/anything)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Project
        run: dotnet publish src/Azure.DataApiBuilder.sln --configuration Release --output ./published-app

      - name: Save Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dab-compiled-release
          path: ./published-app